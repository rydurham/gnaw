[package]
name = "gnaw"
version = "0.1.0"
edition = "2021"
description = "Automatic desktop wallpaper rotation for GNOME"
license = "MIT"

[[bin]]
name = "gnaw"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
gtk4 = { version = "0.9", features = ["v4_10"], optional = true }
libadwaita = { version = "0.7", features = ["v1_4"], optional = true }
